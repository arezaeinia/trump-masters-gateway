backend:
  base-url: ${http://localhost:8080}

  timeout-seconds: 15
  connection-pool:
    max-connections: 500
    pending-acquire-max: 1000
    max-idle-time-seconds: 30

websocket:
  path: /ws

# Service-to-service authentication (gateway → backend)
# Disabled by default (for local/load-test). Enable in production with environment variables.
service:
  token:
    enabled: ${SERVICE_TOKEN_ENABLED:true}
    keycloak-url: ${KEYCLOAK_URL:http://localhost:4433}
    username: ${SERVICE_TOKEN_USERNAME:gateway-service}
    password: ${SERVICE_TOKEN_PASSWORD:changeme}
    client: ${SERVICE_TOKEN_CLIENT:sample-client}

spring:
  application:
    name: baltazar-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  redis:
    subscribe-pattern: /topic/public/*

loki-url: ${LOKI_URL:http://localhost:3100}

logging:
  level:
    root: INFO
    com.arnia.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

